<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Clock<span>/</span>Mgmt</div>
    <div class="stats" id="stats"></div>
    <div class="actions">
      <button id="btnTemplate" class="btn" title="Rondas y pasos para proyectos nuevos">Plantilla</button>
      <button id="btnSound" class="btn" title="Activar o silenciar sonido"></button>
      <button id="btnExport" class="btn" title="Descargar respaldo JSON">Exportar</button>
      <label class="btn" title="Cargar respaldo JSON">Importar<input type="file" id="fileImport" accept="application/json" hidden></label>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button class="btn btn-solid btn-big" data-action="new"><span class="tri"></span>Nuevo y arrancar</button>
      <div id="projectList" class="project-list"></div>
      <p class="hint"><kbd>Espacio</kbd> iniciar / pausar<br><kbd>N</kbd> siguiente paso</p>
    </aside>
    <main id="main"></main>
  </div>

  <dialog id="dlgTemplate" class="dlg">
    <form id="tplForm" method="dialog">
      <h2>Plantilla de rondas</h2>
      <p class="dlg-note">Se aplica a los proyectos nuevos. Etiqueta corta, nombre y un paso por línea.</p>
      <div id="tplRounds"></div>
      <div class="dlg-actions">
        <button type="button" class="btn" id="tplAdd">+ Ronda</button>
        <button type="button" class="btn" id="tplReset">Restaurar</button>
        <span class="spacer"></span>
        <button value="cancel" class="btn" formnovalidate>Cancelar</button>
        <button value="save" class="btn btn-solid">Guardar</button>
      </div>
    </form>
  </dialog>

  <canvas id="fx"></canvas>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
