<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock Management</title>
  <link rel="icon" id="favicon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee.
    try {
      const t = JSON.parse(localStorage.getItem('clock-management:v1'))?.settings?.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <div class="debug-banner" id="debugBanner" hidden>
    <span>Modo prueba · tus datos reales no se tocan</span>
    <button class="btn btn-small" data-debug="exit">Salir</button>
  </div>
  <header class="topbar">
    <div class="brand">Clock<span>/</span>Mgmt</div>
    <div class="stats" id="stats"></div>
    <div class="actions">
      <button id="btnTemplate" class="btn" title="Crear y editar plantillas de rondas">Plantillas</button>
      <div class="menu-wrap">
        <button id="btnMenu" class="btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu">Menú <span class="caret"></span></button>
        <div id="menu" class="menu" role="menu" hidden>
          <button class="menu-item" id="mSound" role="menuitem"><span>Sonido</span><b></b></button>
          <button class="menu-item" id="mTheme" role="menuitem"><span>Tema</span><b></b></button>
          <button class="menu-item" id="mFriction" role="menuitem" title="Con ritmo activo, pausar pide mantener presionado"><span>Pausa con fricción</span><b></b></button>
          <button class="menu-item" id="mImages" role="menuitem" title="Al subir de nivel, muestra una imagen al azar de una carpeta de tu computadora"><span>Imágenes de nivel</span><b></b></button>
          <button class="menu-item sub" id="mFolder" role="menuitem" hidden><span>Carpeta</span><b></b></button>
          <button class="menu-item sub" id="mForget" role="menuitem" hidden><span>Olvidar carpeta</span><b></b></button>
          <input type="file" id="dirFallback" webkitdirectory multiple hidden>
          <hr>
          <button class="menu-item" id="mExport" role="menuitem"><span>Exportar respaldo</span><b>JSON</b></button>
          <label class="menu-item" role="menuitem" for="fileImport"><span>Importar respaldo</span><b>JSON</b><input type="file" id="fileImport" accept="application/json" hidden></label>
          <hr>
          <button class="menu-item" id="mDebug" role="menuitem" title="Muestra el panel de debug al final de la página"><span>Debug</span><b></b></button>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button class="btn btn-solid btn-big" data-action="new">+ Nuevo proyecto</button>
      <div id="projectList" class="project-list"></div>
      <p class="hint"><kbd>Espacio</kbd> iniciar / pausar<br><kbd>N</kbd> siguiente paso</p>
    </aside>
    <main id="main"></main>
  </div>

  <footer class="debug" id="debugFooter" hidden>
    <div class="debug-head">Debug</div>
    <div class="debug-body" id="debugBody"></div>
  </footer>

  <dialog id="dlgTemplate" class="dlg tpl-dlg" aria-labelledby="tplTitle">
    <form id="tplForm" method="dialog" class="tpl-shell">
      <header class="tpl-head">
        <div class="tpl-bar">
          <h2 id="tplTitle">Plantillas</h2>
          <select id="tplSelect" aria-label="Plantilla a editar"></select>
          <button type="button" class="btn btn-small" id="tplNew">Nueva</button>
          <button type="button" class="btn btn-small" id="tplDup">Duplicar</button>
          <button type="button" class="btn btn-small btn-danger" id="tplDel">Eliminar</button>
        </div>
        <div class="tpl-meta">
          <input id="tplName" aria-label="Nombre de la plantilla" placeholder="Nombre de la plantilla">
          <label class="chk"><input type="checkbox" id="tplDefault"> Predeterminada</label>
        </div>
      </header>
      <div class="tpl-body" id="tplBody"></div>
      <footer class="tpl-foot">
        <button type="button" class="btn btn-small" id="tplMode">Editar como texto</button>
        <span class="tpl-note">Los cambios no tocan proyectos existentes.</span>
        <span class="spacer"></span>
        <button type="button" class="btn" id="tplCancel">Cancelar</button>
        <button type="button" class="btn btn-solid" id="tplSave">Guardar</button>
      </footer>
    </form>
  </dialog>

  <dialog id="dlgConfirm" class="dlg dlg-confirm">
    <form method="dialog">
      <h2 id="confirmTitle"></h2>
      <p id="confirmText"></p>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button type="button" class="btn" id="confirmCancel">Cancelar</button>
        <button type="button" class="btn btn-solid" id="confirmOk">Aceptar</button>
      </div>
    </form>
  </dialog>

  <canvas id="fx"></canvas>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
